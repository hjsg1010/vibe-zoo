  {id:'opened',title:'지금 쓰는 웹에 Keeper를 열어보세요',text:'오른쪽 위 Keeper 버튼을 누르면 이 사이트의 도구를 준비합니다.',label:'Keeper 열기',action:'keeper',target:'#keeper-toggle'},
  {id:'tools',title:'무엇을 할 수 있는지 살펴보세요',text:'도구 꾸러미를 열어 입력과 결과를 확인하세요.',label:'도구 살펴보기',action:'tools',target:'[data-action="tools"]'},
  {id:'created',title:'말 한마디로 버킷을 만들어보세요',text:'생성할 이름을 확인하고 실행하면 왼쪽 목록에 바로 나타납니다.',label:'버킷 생성 요청',action:'example-create',target:'[data-action="example-create"]'},
  {id:'monitored',title:'버킷별 사용 현황을 확인하세요',text:'샘플 버킷의 용량·객체 수·요청 추이를 웹과 대화에서 함께 봅니다.',label:'모니터링 요청',action:'example-monitor',target:'[data-action="example-monitor"]'},

  {id:'key-deleted',title:'발급한 키를 삭제해보세요',text:'정확한 키를 선택하고 삭제하면 웹 목록에서도 제거됩니다.',label:'키 삭제 요청',action:'example-delete-key',target:'[data-action="example-delete-key"]'},
  {id:'recorded',title:'반복할 업무를 한 번 보여주세요',text:'녹화를 켜고 왼쪽 웹에서 다른 버킷을 만들어보세요.',label:'업무 가르치기',action:'teach',target:'[data-action="start-record"]'},
  {id:'saved',title:'업무 순서를 내 Skill로 저장하세요',text:'의도와 바꿀 입력, 성공 조건을 확인하고 초안을 저장하세요.',label:'Skill 이어 만들기',action:'teach',target:'[data-action="save-skill"]'},
  {id:'reused',title:'다른 입력으로 다시 실행해보세요',text:'버킷 이름을 바꿔도 배운 순서대로 실행되는지 확인하세요.',label:'다른 이름으로 실행',action:'reuse',target:'[data-action="reuse"]'},
  {id:'second-site',title:'처음 보는 다른 웹에서도 시작해보세요',text:'업무 보드 탭에서 새로운 도구를 준비하고 업무를 생성·완료해보세요.',label:'다른 사이트 체험',action:'site',value:'board',target:'[data-action="site"][data-value="board"]'}
];
function mark(id) { if (!site().done.includes(id)) site().done.push(id); }
function toast(message) { $('#toast').textContent=message; $('#toast').hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('#toast').hidden=true,3500); }
function message(text,type='assistant') { site().messages.push({text,type}); }
function showDialog(id) { lastDialogFocus=document.activeElement; if (!$(id).open) $(id).showModal(); }
function closeDialog(id) { $(id).close(); if(lastDialogFocus?.isConnected) lastDialogFocus.focus(); }
function journeyForSite() {return currentSite==='board'?boardSteps:steps;}
function currentStep() { return journeyForSite().find(step=>!site().done.includes(step.id)); }
function render() {
  const s=site();
  $('#site-tabs').innerHTML=Object.entries(sites).map(([id,data])=>`<button role="tab" aria-selected="${id===currentSite}" data-action="site" data-value="${id}">${id==='minio'?'▣':'◈'} &nbsp; ${escapeHTML(data.name)}</button>`).join('');
  $('#address').textContent=`https://${s.host}${s.path}`;
  $('#site-label').textContent=s.name;
  $('#keeper-toggle').setAttribute('aria-expanded',keeperOpen);
  $('#keeper-toggle').innerHTML=`🦁 <span>Keeper ${keeperOpen?'닫기':'열기'}</span>`;
  $('#keeper-panel').hidden=!keeperOpen;
  $('#workspace').classList.toggle('open',keeperOpen);
  document.querySelectorAll('[data-action="panel"]').forEach(el=>el.classList.toggle('active',el.dataset.value===s.panel));
  renderWebsite();
  $('#panel-content').innerHTML=!s.ready?renderPreparation():s.panel==='assets'?renderAssets():s.panel==='teach'?renderTeach():renderChat();
  $('#composer').innerHTML=s.ready&&s.panel==='chat'?`<div class="composer"><form id="chat-form"><input aria-label="Keeper에 요청" id="chat-input" placeholder="이 사이트에서 하고 싶은 일을 말해보세요" required autocomplete="off"><button type="submit" class="primary" aria-label="요청 보내기">↑</button></form><small>${escapeHTML(s.name)} · 모의 실행</small></div>`:'';
  $('#welcome-guide').innerHTML=!keeperOpen&&!s.done.includes('opened')&&guided?`<div class="welcome-card"><span class="eyebrow">YOUR FIRST HABITAT</span><h2>이 웹에서도,<br>말로 일할 수 있을까요?</h2><p>평소 쓰던 화면은 그대로 두세요.<br>Keeper가 이 사이트의 일하는 법을 알아갑니다.</p>${button('Keeper와 시작하기 ↗','keeper','','primary wide')}</div>`:'';
  renderGuide();
}
function renderGuide() {
  const s=site(), next=currentStep(),journey=journeyForSite();
  $('#journey').innerHTML=journey.map(step=>`<li>${s.done.includes(step.id)?'✓ ':''}${step.title}</li>`).join('');
  let content;
  if (!guided) content=`<div class="guide-copy"><strong>자유롭게 체험하고 있어요</strong><p>안내를 다시 켜도 지금까지의 진행과 데이터는 유지됩니다.</p></div>${button('안내 다시 켜기','guide','','small')}`;
  else if(!keeperOpen&&s.done.includes('opened')) content=`<span class="step-number">🦁</span><div class="guide-copy"><strong>Keeper에서 체험을 이어가세요</strong><p>현재 사이트의 데이터와 진행은 그대로예요.</p></div>${button('Keeper 열기','keeper','','primary')}`;
  else if(keeperOpen&&!s.ready) content=`<span class="step-number">01</span><div class="guide-copy"><strong>${s.progress?'현재 페이지에서 도구를 준비하고 있어요':'도구 준비가 중단되었어요'}</strong><p>${s.progress?'모의 관찰 → 기능 정리 → 도구와 기본 Skill 준비':'다시 준비하면 현재 단계부터 체험할 수 있어요.'}</p></div>`;
  else if(next) content=`<span class="step-number">${String(journey.indexOf(next)+1).padStart(2,'0')}</span><div class="guide-copy"><strong>${next.title}</strong><p>${next.text}</p></div><div class="guide-progress" aria-label="${s.done.length}개 행동 완료">${journey.map(step=>`<i class="${s.done.includes(step.id)?'done':''}"></i>`).join('')}</div>${button(next.label,next.action,next.value||'','primary')}${button('자유 체험','guide','','quiet small')}`;
  else if(currentSite==='board') content=`<span class="step-number">✓</span><div class="guide-copy"><strong>새로운 웹에서도 업무를 마쳤어요.</strong><p>MinIO로 돌아가면 기존 버킷·키·Skill이 그대로 남아 있습니다.</p></div>${button('MinIO로 돌아가기','site','minio','primary')}${button('자유 체험','guide','','quiet small')}`;
  else content=`<span class="step-number">✓</span><div class="guide-copy"><strong>내 웹에서, 내 업무를 완주했어요.</strong><p>도구 준비부터 개인 Skill 재사용까지 체험했습니다. 팀 공유도 살펴보세요.</p></div>${button('팀 Store 살펴보기','store','','primary')}${button('자유 체험','guide','','quiet small')}`;
  $('#guide').innerHTML=content;
  if(guided&&next&&keeperOpen&&s.ready) {
    const target=document.querySelector(`#workspace ${next.target}`);
    if(target) target.classList.add('focus-target');
  }
}
function renderWebsite() {
  const s=site();
  if(currentSite==='board'){renderBoard();return;}
  $('#website').innerHTML=`<header class="web-head"><span class="web-brand">MINIO</span><small>Console · demo-user</small></header>${s.recording?'<div class="record-banner">● 녹화 중 · Create Bucket으로 새 버킷을 하나 만들어주세요.</div>':''}<div class="web-layout"><nav class="web-nav" aria-label="MinIO 메뉴">${button('▣ &nbsp; Buckets','web-view','buckets',s.view==='buckets'?'active':'')}${button('⌁ &nbsp; Monitoring','web-view','monitor',s.view==='monitor'?'active':'')}${button('⚿ &nbsp; Access Keys','web-view','keys',s.view==='keys'?'active':'')}</nav><div class="web-main">${s.view==='monitor'?renderMonitoring():s.view==='keys'?renderKeys():renderBuckets()}</div></div>`;
}
function renderBuckets() {
  const s=site();
  return `<div class="crumb">Console / Object Browser</div><div class="web-title"><h2>Object Browser</h2>${button('＋ Create Bucket','web-create','','web-button')}</div><div class="stats"><div class="stat"><small>BUCKETS</small><strong>${s.buckets.length}</strong></div><div class="stat"><small>OBJECTS</small><strong>${s.buckets.reduce((n,b)=>n+b.objects,0)}</strong></div><div class="stat"><small>USAGE</small><strong>${s.buckets.reduce((n,b)=>n+b.usage,0).toFixed(1)} <small style="display:inline">GB</small></strong></div></div><div class="table-wrap"><table aria-label="버킷 목록"><thead><tr><th>BUCKET NAME</th><th>ACCESS</th><th>OBJECTS</th></tr></thead><tbody>${s.buckets.map((b,i)=>`<tr class="${i>2?'new-row':''}"><td>${button('▱ &nbsp; '+escapeHTML(b.name),'bucket-detail',b.name,'quiet small')}</td><td>Private</td><td>${b.objects}</td></tr>`).join('')}</tbody></table></div><p class="web-hint">내 계정의 웹 화면에서 결과를 확인하세요. 표시된 데이터는 모의 값입니다.</p>`;
}
function renderPreparation() {
  const s=site(), labels=['현재 페이지 관찰','사용 가능한 기능 확인','도구와 기본 Skill 구성'];
  return `<span class="eyebrow">A NEW HABITAT</span><h2>${s.progress?'이 사이트의 일하는 법을<br>알아가는 중이에요.':'도구 준비를 이어가세요.'}</h2><p>처음 방문한 사이트입니다.<br>현재 탭에서 사용할 도구를 준비합니다.</p><div class="progress"><span style="width:${s.progress/4*100}%"></span></div>${labels.map((label,i)=>`<div class="generation-step ${s.progress>i+1?'done':''}">${s.progress>i+1?'✓':'○'} &nbsp; ${label}</div>`).join('')}<div class="info">${toolsForSite().map(t=>t.name).join(' · ')}</div>${s.progress?button('준비 중단','cancel-generation','','wide small'):button('다시 준비하기','generate','','primary wide')}<p>미리 구성한 기능으로 진행하는 모의 체험입니다.</p>`;

function examples() {
  if(currentSite==='board')return `${button('내 업무 목록 보여줘','example-list')}${button('데모 발표 준비 업무 만들어줘','task-create')}${button('업무 상태 변경하기','task-status')}`;
  return `${button('내 버킷 목록 보여줘','example-list')}${button('demo-assets 버킷 만들어줘','example-create')}${button('research-datasets 사용 현황 보여줘','example-monitor')}${button('데모용 접근 키 발급해줘','example-key')}${site().keys.length?button('접근 키 삭제하기','example-delete-key'):''}`;
}
function renderChat() {
  const s=site();
  return `${s.messages.length?s.messages.map(m=>`${m.type==='assistant'?'<div class="message-name">🦁 KEEPER</div>':''}<div class="bubble ${m.type}">${escapeHTML(m.text)}</div>`).join(''):`<span class="pill">● ${toolsForSite().length}개 도구 준비됨</span><h2>이제 말로 일해보세요.</h2><p>요청하면 왼쪽 웹 화면에서 결과를 함께 확인할 수 있어요.</p><div class="card"><div class="row"><span class="avatar">🦫</span><div><h3>${escapeHTML(s.name)} 도구 꾸러미</h3><small>MCP 도구 ${toolsForSite().length}개 · 기본 Skill 1개</small></div></div>${button('도구 구성 살펴보기 ↗','tools','','small wide')}</div>`}${s.pending?`<div class="card"><span class="eyebrow">실행 내용 확인</span><h3>${escapeHTML(pendingTitle())}</h3><p>대상: ${escapeHTML(s.name)} · 내 계정<br>${escapeHTML(s.pending.name)}${s.pending.taskId?'<br>업무: '+escapeHTML(s.pending.taskId):''}${s.pending.bucket?'<br>버킷: '+escapeHTML(s.pending.bucket):''}${s.pending.keyId?'<br>식별자: '+escapeHTML(s.pending.keyId):''}</p><div class="row">${button('이 내용으로 실행','confirm','','primary small')}${button('취소','cancel','','small')}</div></div>`:''}<div class="suggestions">${examples()}${s.skill?.enabled?button(`${escapeHTML(s.skill.name)} · 다른 입력으로 실행`,'reuse'):''}</div>`;
}
function pendingTitle() {
  if(site().pending?.type==='task-create')return '업무 보드에 새 업무를 만듭니다';
  if(site().pending?.type==='task-status')return '선택한 업무의 상태를 '+site().pending.status+'로 바꿉니다';
  if(site().pending?.type==='key-create')return '선택한 버킷에 모의 접근 키를 발급합니다';
  if(site().pending?.type==='key-delete')return '선택한 접근 키를 삭제합니다';
  return site().pending?.skill?'개인 Skill로 버킷을 생성하고 확인합니다':'새 버킷을 생성하고 목록에서 확인합니다';}
function renderAssets() {
  const s=site();
  return `<span class="eyebrow">MY KEEPER / ${escapeHTML(s.name)}</span><h2>내 도구와 Skill</h2><p>도구는 하나의 기능, Skill은 도구를 사용하는 업무 순서입니다.</p><div class="section-title">이 사이트의 도구 <span class="pill">준비됨</span></div><div class="card"><h3>${escapeHTML(s.name)} 도구 꾸러미</h3><p>MCP 도구 ${toolsForSite().length}개 · v0.1</p>${button('도구 목록 · 입력 · 결과 보기','tools','','small wide')}</div><div class="section-title">기본 Skill <small>도구와 함께 준비</small></div><div class="card"><h3>${currentSite==='board'?'업무 생성과 완료':'버킷 준비와 확인'}</h3><p>${currentSite==='board'?'업무 생성 → 상태 변경 → 결과 확인':'이름 확인 → 생성 → 목록 확인'}</p>${button('실행 순서와 구성 보기','basic-skill','','small wide')}</div><div class="section-title">내가 가르친 Skill ${button('＋ 새로 가르치기','teach','','quiet small')}</div>${s.skill?`<div class="card"><h3>${escapeHTML(s.skill.name)}</h3><p>기본값: ${escapeHTML(s.skill.default)} · ${s.shared?'팀 공유됨':'나만 사용'}</p><label class="toggle-row">대화에서 사용<input type="checkbox" data-action="toggle-skill" ${s.skill.enabled?'checked':''}></label><div class="row">${button('구성 · 편집','personal-skill','','small')}${button('팀에 공유','share','','small')}</div>${button('다른 입력으로 재실행','reuse','','small wide')}</div>`:'<div class="info">아직 개인 Skill이 없어요. 업무를 한 번 보여주면 이곳에 저장됩니다.</div>'}<div class="section-title">팀의 경험</div>${button('공유 Zoo 열기 ↗','store','','wide small')}`;
}
function toolDetails() {
  return toolsForSite().map(t=>`<details class="tool-row"><summary><strong>${t.name}</strong><code>${t.id} ＋</code></summary><dl><dt>입력</dt><dd>${escapeHTML(t.input)}</dd><dt>결과</dt><dd>${escapeHTML(t.output)}</dd><dt>성공 조건</dt><dd>${escapeHTML(t.success)}</dd></dl><details><summary>도구 정의 보기</summary><pre>${escapeHTML(JSON.stringify({name:t.id,description:t.name,input:t.input,output:t.output,success:t.success},null,2))}</pre></details></details>`).join('');
}
function skillSteps() {return '<ol class="skill-steps"><li>입력한 이름과 기존 버킷을 확인합니다.<code>list_buckets</code></li><li>중복이 없으면 기본 옵션으로 생성합니다.<code>create_bucket(bucket_name)</code></li><li>새 목록에 정확한 이름이 있는지 확인합니다.<code>verify_bucket(bucket_name)</code></li></ol>';}
function openDetails(kind) {
  if(currentSite==='board'&&kind==='basic'){openBoardSkill();return;}
  const s=site(), personal=kind==='personal', skill=personal?s.skill:null;
  if(kind==='tools') {
    mark('tools');
    $('#detail-content').innerHTML=`<h2 id="detail-title">${escapeHTML(s.name)} 도구 꾸러미</h2><p>각 항목을 펼쳐 어떤 입력을 받고 결과를 어떻게 확인하는지 살펴보세요.</p><span class="pill">MCP 도구 ${toolsForSite().length}개 · 모의 정의 · v0.1</span>${toolDetails()}<div class="info">이 도구들을 어떤 순서로 사용할까요?</div>${button('기본 Skill 구성 보기 →','basic-skill','','primary wide')}`;
  } else {
    $('#detail-content').innerHTML=`<h2 id="detail-title">${escapeHTML(skill?.name||'버킷 준비와 확인')}</h2><span class="pill">${personal?'개인':'기본'} Skill · v0.1</span><p>${escapeHTML(skill?.intent||'버킷을 만들고 같은 이름이 목록에 있는지 확인합니다.')}</p><h3>실행 순서와 사용하는 도구</h3>${skillSteps()}<div class="info">바꿀 입력: bucket_name<br>기본값: ${escapeHTML(skill?.default||'demo-assets')}<br>성공 조건: ${escapeHTML(skill?.success||'입력한 이름이 버킷 목록에 표시된다')}</div><details class="tool-row"><summary>Skill 원문 보기</summary><pre>${escapeHTML(`# ${skill?.name||'버킷 준비와 확인'}\n\n입력: bucket_name\n기본값: ${skill?.default||'demo-assets'}\n1. list_buckets로 중복 확인\n2. create_bucket으로 생성\n3. verify_bucket으로 결과 확인\n성공: ${skill?.success||'정확한 이름이 목록에 존재함'}`)}</pre></details>${personal?`<form id="edit-skill-form"><label class="field" for="edit-name">Skill 이름</label><input class="text" id="edit-name" value="${escapeHTML(skill.name)}" required maxlength="80"><label class="field" for="edit-default">기본 버킷 이름</label><input class="text" id="edit-default" value="${escapeHTML(skill.default)}" required><div class="actions">${button('취소','close-detail')}<button type="submit" class="primary">내 설정에 저장</button></div></form>`:button('닫고 체험 계속하기','close-detail','','primary wide')}`;
  }
  renderGuide();
  showDialog('#detail-dialog');
}
function renderTeach() {

function bucketError(name) {
  if(!/^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$/.test(name)||name.includes('..')||/^\d+\.\d+\.\d+\.\d+$/.test(name)) return '소문자·숫자·점·하이픈으로 3~63자를 입력하세요. 연속된 점과 IP 주소 형식은 사용할 수 없어요.';
  if(site().buckets.some(b=>b.name===name)) return `${name} 버킷이 이미 있어요. 다른 이름을 입력하세요.`;
  return '';
}
function requestCreate(name,skill=false) {
  site().panel='chat'; site().pending={type:'create',name,skill};
  message(skill?`${name} 버킷을 ${site().skill.name} Skill로 만들어줘`:`${name} 버킷 만들어줘`,'user');

}
function confirmTask() {
  const s=site(), task=s.pending;
  if(!task) return;
  if(task.type==='task-create'){
    if(s.tasks.some(t=>t.title===task.name)){message('같은 제목의 업무가 있어요. 다른 제목을 입력해주세요.');s.pending=null;render();return;}
    const created={id:'TASK-'+String(s.nextTask++).padStart(3,'0'),title:task.name,status:'할 일',owner:'나'};
    s.tasks.push(created);s.lastCreated=created.id;mark('task-created');message(`${created.id} · ${created.title} 업무를 만들었어요.\n✓ 왼쪽 보드의 할 일 목록에서 확인했어요.`);
    s.pending=null;render();return;
  }
  if(task.type==='task-status'){
    const item=s.tasks.find(t=>t.id===task.taskId);
    if(!item){message('업무를 찾을 수 없어요.');s.pending=null;render();return;}
    item.status=task.status;
    if(item.status==='완료'&&item.id===s.lastCreated){mark('task-completed');if(!sites.minio.done.includes('second-site'))sites.minio.done.push('second-site');}
    message(`${item.id} · ${item.title} 상태를 ${item.status}로 변경했어요.\n✓ 같은 업무가 왼쪽 ${item.status} 열에 표시됩니다.`);s.pending=null;render();return;
  }
  if(task.type==='key-create'){
    const error=keyError(task.name,task.bucket);
    if(error){message(error);s.pending=null;render();return;}
    const key=createKey(task.name,task.bucket);
    message(`${key.name} 접근 키를 발급했어요.\n식별자: ${key.id}\n대상 버킷: ${key.bucket}\n✓ 웹의 키 목록에서 확인했어요.`);
    s.pending=null;render();showKeySecret(key);return;
  }
  if(task.type==='key-delete'){
    const key=s.keys.find(k=>k.id===task.keyId);
    if(!key){message('해당 키가 이미 삭제됐어요.');s.pending=null;render();return;}
    s.keys=s.keys.filter(k=>k.id!==task.keyId);s.view='keys';mark('key-deleted');
    message(`${key.name} (${key.id}) 접근 키를 삭제했어요.\n✓ 목록에서 제거된 것을 확인했어요. 다른 키는 그대로입니다.`);
    s.pending=null;render();return;
  }
  const error=bucketError(task.name);
  if(error){message(error);s.pending=null;render();return;}
  s.buckets.push({name:task.name,objects:0,usage:0});
  message(`${task.name} 버킷을 생성했어요.\n✓ 기본 옵션으로 생성\n✓ 목록에 정확한 이름이 있는지 확인${task.skill?'\n✓ 저장한 Skill의 순서로 실행':''}`);
  mark('created');
  if(task.skill&&task.name!==s.recordedName) mark('reused');
  s.pending=null; s.view='buckets'; render();
}

function sendMessage(text) {
  if(!site().ready||!text.trim())return;
  if(currentSite==='board'){sendBoardMessage(text);return;}
  if(/키|key/i.test(text)){
    message(text,'user');
    if(/삭제|제거/.test(text)){openKeyPicker();return;}
    if(/발급|만들|생성/.test(text)){openKeyForm();return;}
    sKeyList();return;
  }
  if(/현황|사용량|모니터|추이/.test(text)){
    const named=site().buckets.find(b=>text.includes(b.name));
    const requested=(text.match(/[a-z0-9][a-z0-9.-]{2,62}/i)||[])[0];
    if(requested&&!named){message(text,'user');message(`${requested} 버킷을 찾지 못했어요. 왼쪽 목록에서 대상을 확인해주세요.`);render();return;}
    monitor(named?.name||site().selectedBucket,true,text);return;
  }
  if(/만들|생성/.test(text)){
    const name=(text.match(/[a-z0-9][a-z0-9.-]{2,62}/i)||[])[0]||site().skill?.default||'demo-assets';
    const wantsSkill=/skill|스킬/i.test(text);
    if(wantsSkill&&(!site().skill||!site().skill.enabled)){message(text,'user');message('사용 가능한 개인 Skill이 없어요. 먼저 Skill을 저장하고 대화 사용을 켜주세요.');render();return;}
    requestCreate(name,wantsSkill);return;
  }
  message(text,'user');
  if(/목록|조회|보여/.test(text)) {site().view='buckets';message(`현재 버킷 ${site().buckets.length}개를 확인했어요.\n${site().buckets.map(b=>'• '+b.name).join('\n')}\n\n왼쪽 웹의 목록과 일치합니다.`);}
  else message('이 모의 체험에서 사용할 수 있는 요청을 아래에서 선택해보세요.');
  render();
}

function handleAction(action,value) {
  const s=site();
  if(action==='keeper'){keeperOpen=!keeperOpen;if(keeperOpen){mark('opened');if(!s.ready&&!s.progress){generate();return;}}render();return;}
  if(action==='generate'){generate();return;}
  if(action==='cancel-generation'){clearInterval(generationTimers[currentSite]);delete generationTimers[currentSite];s.progress=0;render();return;}
  if(action==='panel'){s.panel=value;render();return;}
  if(action==='tools'){openDetails('tools');return;}
  if(action==='basic-skill'){openDetails('basic');return;}
  if(action==='personal-skill'){openDetails('personal');return;}
  if(action==='close-detail'){closeDialog('#detail-dialog');return;}
  if(action==='close-web'){closeDialog('#web-dialog');return;}
  if(action==='close-store'){closeDialog('#store-dialog');return;}
  if(action==='guide'){guided=!guided;render();return;}
  if(action==='reset'){Object.values(generationTimers).forEach(clearInterval);Object.keys(generationTimers).forEach(id=>delete generationTimers[id]);sites={minio:initialSite(),board:initialBoard()};currentSite='minio';keeperOpen=false;guided=true;document.querySelectorAll('dialog[open]').forEach(d=>d.close());render();return;}
  if(action==='site'){switchSite(value);return;}
  if(action==='minio-teach'){switchSite('minio');site().panel='teach';render();return;}
  if(action==='task-create'){openTaskForm();return;}
  if(action==='task-status'){openTaskStatus(value);return;}
  if(action==='web-view'){s.view=value;render();return;}
  if(action==='bucket-detail'){monitor(value,false);return;}
  if(action==='example-monitor'){monitor('research-datasets',true);return;}
  if(action==='example-key'||action==='web-key-create'){openKeyForm();return;}
  if(action==='example-delete-key'){openKeyPicker();return;}
  if(action==='delete-key'){requestKeyDelete(value);return;}
  if(action==='web-create'){openBucketForm();return;}
  if(action==='example-list'){sendMessage(currentSite==='board'?'내 업무 목록 보여줘':'내 버킷 목록 보여줘');return;}
  if(action==='example-create'){requestCreate('demo-assets');return;}
  if(action==='confirm'){confirmTask();return;}
  if(action==='cancel'){s.pending=null;message('실행을 취소했어요. 웹 데이터는 바뀌지 않았어요.');render();return;}
  if(action==='teach'){s.panel='teach';render();return;}
  if(action==='start-record'){s.recording=true;s.traces=[];s.recordedName='';s.draft=null;s.view='buckets';render();return;}
  if(action==='stop-record'){if(!s.recordedName){toast('왼쪽 웹에서 새 버킷을 만든 뒤 종료해주세요.');return;}s.recording=false;s.teachStage='form';mark('recorded');render();return;}
  if(action==='cancel-record'){s.recording=false;s.traces=[];s.teachStage='intro';render();return;}
  if(action==='edit-draft'){s.teachStage='form';render();return;}
  if(action==='save-skill'){s.skill={...s.draft,name:'프로젝트 버킷 준비',enabled:true};s.teachStage='intro';s.panel='assets';mark('saved');render();toast('내 Skill에 저장했어요. 다른 입력으로 실행해보세요.');return;}
  if(action==='toggle-skill'){s.skill.enabled=!s.skill.enabled;render();return;}
  if(action==='reuse'){reuse();return;}
  if(action==='store'){openStore();return;}
  if(action==='share'){openStore(true);return;}
  if(action==='confirm-share'){s.shared=true;openStore();render();toast('팀에 공유했어요 · 실제 게시 없음');return;}
  if(action==='install'){s.installed=true;openStore();toast('현재 사이트의 Keeper에 설치했어요 · 시안');return;}
}

function metricData(bucket) {
  const samples={'research-datasets':[18,24,15,38,30,48,34,62,40,58,76,51], 'model-artifacts':[10,16,11,20,38,28,19,36,27,43,36,48], 'team-reports':[8,12,7,15,11,18,21,14,9,16,19,24]};
  const series=samples[bucket.name]||Array(12).fill(0);
  return {series,requests:series.reduce((a,b)=>a+b,0),errors:bucket.name==='research-datasets'?2:0};
}

function renderKeys() {
  const s=site();
  return `<div class="crumb">Console / Access Keys</div><div class="web-title"><h2>Access Keys</h2>${button('＋ Create Access Key','web-key-create','','web-button')}</div><div class="info">실제로 사용할 수 없는 데모용 키입니다. 선택한 버킷에만 사용하는 예시로 표시합니다.</div><div class="table-wrap"><table aria-label="접근 키 목록"><thead><tr><th>NAME / ACCESS KEY</th><th>BUCKET</th><th>ACTION</th></tr></thead><tbody>${s.keys.length?s.keys.map(k=>`<tr><td><strong>${escapeHTML(k.name)}</strong><br><small>${escapeHTML(k.id)}</small></td><td>${escapeHTML(k.bucket)}</td><td>${button('삭제','delete-key',k.id,'small danger')}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">발급된 접근 키가 없습니다.</td></tr>'}</tbody></table></div><p class="web-hint">Secret은 발급 직후 한 번 표시합니다. 목록에 Secret을 남기지 않습니다.</p>`;
}
function keyError(name,bucket) {
  if(!name||name.length>40)return '키 이름을 1~40자로 입력해주세요.';
  if(site().keys.some(k=>k.name===name))return '같은 이름의 키가 있어요. 다른 이름을 사용해주세요.';
  if(!site().buckets.some(b=>b.name===bucket))return '대상 버킷이 존재하지 않아요.';
  return '';
}
function createKey(name,bucket) {
  const s=site(), key={id:'DEMO-ACCESS-'+String(s.nextKey++).padStart(3,'0'),name,bucket};
  s.keys.push(key);s.view='keys';mark('key-created');return key;
}
function showKeySecret(key) {
  $('#web-dialog-content').innerHTML=`<h2 id="web-dialog-title">접근 키가 발급됐어요</h2><p>${escapeHTML(key.name)} · ${escapeHTML(key.bucket)}</p><label class="field">Access Key</label><code>${escapeHTML(key.id)}</code><label class="field">Secret · 지금 한 번만 표시</label><pre>DEMO-ONLY-NOT-A-REAL-SECRET-${escapeHTML(key.id)}</pre><div class="info">모의 문자열입니다. 실제 계정이나 API에 사용할 수 없습니다.</div>${button('확인 · 키 목록 보기','close-web','','primary wide')}`;
  showDialog('#web-dialog');
}
function openKeyForm() {
  const s=site();
  if(!s.ready){toast('Keeper에서 도구를 먼저 준비해주세요.');return;}
  s.view='keys';render();
  $('#web-dialog-content').innerHTML=`<h2 id="web-dialog-title">접근 키 발급</h2><p>사용할 버킷과 알아보기 쉬운 이름을 선택하세요.</p><form id="key-form"><label class="field" for="key-name">키 이름</label><input class="text" id="key-name" value="demo-key-${s.nextKey}" required maxlength="40"><label class="field" for="key-bucket">대상 버킷</label><select id="key-bucket" class="wide">${s.buckets.map(b=>`<option ${b.name===s.selectedBucket?'selected':''}>${escapeHTML(b.name)}</option>`).join('')}</select><div class="info">범위: 선택한 버킷 · 읽기/쓰기 · 모의 권한<br>다른 버킷이나 계정에 대한 권한을 만들지 않습니다.</div><div class="actions">${button('취소','close-web')}<button type="submit" class="primary">발급 내용 확인</button></div></form>`;
  showDialog('#web-dialog');
}
function openKeyPicker() {
  const s=site();s.view='keys';s.panel='chat';render();
  if(!s.keys.length){message('삭제할 접근 키가 없어요. 먼저 데모용 키를 발급해주세요.');render();return;}
  $('#web-dialog-content').innerHTML=`<h2 id="web-dialog-title">삭제할 키 선택</h2><p>이름과 식별자를 확인하세요. 선택 후 한 번 더 실행 내용을 확인합니다.</p><div class="stack">${s.keys.map(k=>button(`${escapeHTML(k.name)} · ${escapeHTML(k.id)}`,'delete-key',k.id)).join('')}</div><div class="actions">${button('취소','close-web')}</div>`;
  showDialog('#web-dialog');
}
function requestKeyDelete(id) {
  const key=site().keys.find(k=>k.id===id);if(!key)return;
  if($('#web-dialog').open)closeDialog('#web-dialog');
  keeperOpen=true;site().panel='chat';site().pending={type:'key-delete',name:key.name,keyId:key.id,bucket:key.bucket};
  message(`${key.name} (${key.id}) 접근 키 삭제해줘`,'user');render();$('#panel-content').scrollTop=$('#panel-content').scrollHeight;
}
function sKeyList(){site().view='keys';message(site().keys.length?site().keys.map(k=>`${k.name} · ${k.id} · ${k.bucket}`).join('\n'):'발급된 접근 키가 없어요.');render();}
document.addEventListener('change',event=>{if(event.target.id==='monitor-bucket')monitor(event.target.value,false);});

  {id:'task-created',title:'이 보드에 새 업무를 만들어보세요',text:'업무 제목을 입력하면 왼쪽 할 일 열에 카드가 나타납니다.',label:'업무 생성 요청',action:'task-create',target:'[data-action="task-create"]'},
  {id:'task-completed',title:'방금 만든 업무를 완료해보세요',text:'해당 업무를 선택하고 완료로 바꾸면 카드가 이동합니다.',label:'업무 완료 요청',action:'task-status',target:'[data-action="task-status"]'}
];
function switchSite(id) {
  if(!sites[id]||id===currentSite)return;
  if(site().recording){toast('현재 사이트의 녹화를 종료하거나 기록을 버린 뒤 탭을 바꿔주세요.');return;}
  currentSite=id;
  if(keeperOpen){mark('opened');if(!site().ready&&!site().progress){generate();return;}}
  render();
}
function renderBoard() {
  const s=site();
  $('#website').innerHTML=`<header class="web-head"><span class="web-brand" style="color:#6477b1">◈ Daylight</span><small>Product team · My workspace</small></header><div class="board-main"><div class="crumb">Workspace / Product team</div><div class="web-title"><div><h2>작은 일부터, 함께.</h2><small>우리 팀의 오늘 할 일을 한눈에.</small></div>${button('＋ 새 업무','task-create','','web-button')}</div><div class="board-tabs"><strong>보드</strong><span>내 업무 ${s.tasks.length}개</span><span class="pill">팀 데모</span></div><div class="kanban">${['할 일','진행 중','완료'].map((status,i)=>`<section class="kanban-column" aria-label="${status} 업무"><h3><span class="board-dot dot-${i}"></span>${status} <small>${s.tasks.filter(t=>t.status===status).length}</small></h3>${s.tasks.filter(t=>t.status===status).map(t=>`<article class="task-card"><small>${t.id}</small><h4>${escapeHTML(t.title)}</h4><div class="row between"><span class="owner-avatar">나</span>${button('상태 변경','task-status',t.id,'quiet small')}</div></article>`).join('')||'<div class="empty">아직 업무가 없어요.</div>'}</section>`).join('')}</div><p class="web-hint">가상의 업무 관리 웹사이트입니다. MinIO와 데이터·대화·도구를 따로 유지합니다.</p></div>`;
}
function openTaskForm() {
  if(!site().ready){toast('Keeper를 열어 이 사이트의 도구를 먼저 준비해주세요.');return;}
  $('#web-dialog-content').innerHTML=`<h2 id="web-dialog-title">새 업무 만들기</h2><p>이 사이트에서는 버킷 대신 팀의 업무를 다룹니다.</p><form id="task-form"><label class="field" for="task-title">업무 제목</label><input class="text" id="task-title" value="데모 발표 준비" required maxlength="80"><div class="actions">${button('취소','close-web')}<button class="primary" type="submit">생성 내용 확인</button></div></form>`;
  showDialog('#web-dialog');
}
function requestTask(title) {
  if(!title.trim()||title.length>80){toast('업무 제목을 1~80자로 입력해주세요.');return;}
  keeperOpen=true;site().panel='chat';site().pending={type:'task-create',name:title.trim()};message(`${title.trim()} 업무 만들어줘`,'user');render();$('#panel-content').scrollTop=$('#panel-content').scrollHeight;
}
function openTaskStatus(id) {
  const s=site();
  if(!s.ready){toast('Keeper에서 도구를 먼저 준비해주세요.');return;}
  const selected=id||s.lastCreated||s.tasks[0]?.id;
  $('#web-dialog-content').innerHTML=`<h2 id="web-dialog-title">업무 상태 변경</h2><p>업무 식별자와 제목을 확인하세요.</p><form id="task-status-form"><label class="field" for="task-item">대상 업무</label><select class="wide" id="task-item">${s.tasks.map(t=>`<option value="${t.id}" ${t.id===selected?'selected':''}>${t.id} · ${escapeHTML(t.title)} (${t.status})</option>`).join('')}</select><label class="field" for="task-state">새 상태</label><select class="wide" id="task-state"><option>할 일</option><option>진행 중</option><option selected>완료</option></select><div class="actions">${button('취소','close-web')}<button class="primary" type="submit">변경 내용 확인</button></div></form>`;
  showDialog('#web-dialog');
}
function sendBoardMessage(text) {
  if(/버킷|접근 키/.test(text)){message(text,'user');message('현재는 업무 보드 탭입니다. 버킷과 접근 키는 MinIO 탭에서 사용할 수 있어요.');render();return;}
  if(/완료|상태|진행 중/.test(text)){
    const id=(text.match(/TASK-\d+/i)||[])[0]?.toUpperCase();
    const named=site().tasks.filter(t=>text.includes(t.title));
    if(id&&!site().tasks.some(t=>t.id===id)){message(text,'user');message('해당 업무 식별자를 찾을 수 없어요. 왼쪽 카드를 확인해주세요.');render();return;}
    message(text,'user');openTaskStatus(id||(named.length===1?named[0].id:undefined));return;
  }
  if(/만들|생성|추가/.test(text)){
    const quoted=text.match(/[“"「](.+?)[”"」]/)?.[1];
    const title=quoted||text.replace(/\s*(업무|태스크)?\s*(만들어\s*줘|생성해\s*줘|추가해\s*줘)[.!]?\s*$/,'').trim();
    requestTask(title);return;
  }
  message(text,'user');
  if(/목록|조회|보여/.test(text))message(site().tasks.map(t=>`${t.id} · ${t.title} · ${t.status}`).join('\n')+'\n\n왼쪽 업무 보드와 일치합니다.');
  else message('업무 목록 조회, 새 업무 생성, 상태 변경을 체험할 수 있어요. 아래 요청을 선택해보세요.');
  render();
}
function openBoardSkill() {
  $('#detail-content').innerHTML=`<h2 id="detail-title">업무 생성과 완료</h2><span class="pill">Daylight 기본 Skill · v0.1</span><p>업무를 만들고, 해당 업무의 상태를 변경한 뒤 결과를 확인합니다.</p><ol class="skill-steps"><li>업무 제목과 현재 목록을 확인합니다.<code>list_tasks</code></li><li>새 업무를 만들고 식별자를 받습니다.<code>create_task(title)</code></li><li>해당 식별자의 업무를 완료로 변경합니다.<code>update_task_status(task_id, "완료")</code></li><li>다시 조회해 같은 업무의 완료 상태를 확인합니다.<code>list_tasks</code></li></ol><div class="info">입력: title · 업무 제목<br>기본값: 데모 발표 준비<br>성공 조건: 생성한 업무 식별자가 완료 열에 표시된다</div><details class="tool-row"><summary>Skill 원문 보기</summary><pre># 업무 생성과 완료\n입력: title\n1. list_tasks로 기존 업무 확인\n2. create_task(title)의 task_id 보관\n3. update_task_status(task_id, "완료")\n4. list_tasks로 같은 task_id의 완료 상태 확인</pre></details>${button('닫고 체험 계속하기','close-detail','','primary wide')}`;
  showDialog('#detail-dialog');
}

document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(target&&!target.disabled)handleAction(target.dataset.action,target.dataset.value);});
document.addEventListener('submit',event=>{
  const s=site(), id=event.target.id;
  event.preventDefault();
  if(id==='task-form'){
    const title=$('#task-title').value.trim();
    if(!title||title.length>80){toast('업무 제목을 1~80자로 입력해주세요.');return;}
    closeDialog('#web-dialog');requestTask(title);return;
  }
  if(id==='task-status-form'){
    const item=s.tasks.find(t=>t.id===$('#task-item').value);
    if(!item){toast('업무를 선택해주세요.');return;}
    const status=$('#task-state').value;
    closeDialog('#web-dialog');keeperOpen=true;s.panel='chat';s.pending={type:'task-status',name:item.title,taskId:item.id,status};
    message(`${item.id} · ${item.title} 상태를 ${status}로 바꿔줘`,'user');render();$('#panel-content').scrollTop=$('#panel-content').scrollHeight;return;
  }
  if(id==='key-form'){
    const name=$('#key-name').value.trim(),bucket=$('#key-bucket').value,error=keyError(name,bucket);
    if(error){toast(error);return;}
    closeDialog('#web-dialog');keeperOpen=true;s.panel='chat';
    s.pending={type:'key-create',name,bucket};message(`${bucket} 버킷에 ${name} 접근 키 발급해줘`,'user');render();$('#panel-content').scrollTop=$('#panel-content').scrollHeight;return;
  }
  if(id==='chat-form'){sendMessage($('#chat-input').value);return;}
  if(id==='bucket-form'){
    const name=$('#bucket-name').value.trim(), error=bucketError(name);
    if(error){$('#bucket-name').setCustomValidity(error);$('#bucket-name').reportValidity();return;}
    s.buckets.push({name,objects:0,usage:0});
    if(s.recording){s.traces.push('이름 입력: '+name,'Create Bucket 제출','완료: 목록에서 '+name+' 확인');s.recordedName=name;}
    closeDialog('#web-dialog');render();toast('버킷이 생성됐어요 · 모의 결과');return;
  }
  if(id==='skill-form'){
    const name=$('#skill-default').value.trim();
    if(bucketError(name)){toast(bucketError(name));return;}
    if(!$('#skill-intent').value.trim()||!$('#skill-success').value.trim()){toast('업무 의도와 성공 조건을 입력해주세요.');return;}
    s.draft={intent:$('#skill-intent').value.trim(),default:name,success:$('#skill-success').value.trim()};s.teachStage='draft';render();return;
  }
  if(id==='edit-skill-form'){
    const name=$('#edit-name').value.trim(), defaultName=$('#edit-default').value.trim();
    if(!name||bucketError(defaultName)){toast(!name?'Skill 이름을 입력해주세요.':bucketError(defaultName));return;}
    s.skill.name=name;s.skill.default=defaultName;closeDialog('#detail-dialog');render();toast('내 Skill 설정을 저장했어요.');return;
  }
  if(id==='reuse-form'){
    const name=$('#reuse-name').value.trim(),error=bucketError(name);
    if(error){$('#reuse-name').setCustomValidity(error);$('#reuse-name').reportValidity();return;}
    closeDialog('#web-dialog');requestCreate(name,true);return;
  }
});
document.addEventListener('input',event=>{if(event.target.setCustomValidity)event.target.setCustomValidity('');});
render();
</script>
