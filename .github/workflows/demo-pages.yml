name: Deploy guided experience
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Include existing public Extension evidence
        run: |
          mkdir -p reference/demo/evidence
          cp screenshots/*.png reference/demo/evidence/
      - name: Version static assets for browser caches
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          root = Path("reference/demo")
          versions = {name: hashlib.sha256((root / name).read_bytes()).hexdigest()[:12] for name in ["app.js", "style.css"]}
          for page in root.glob("*.html"):
              content = page.read_text()
              for name, version in versions.items():
                  content = content.replace('"' + name + '"', '"' + name + '?v=' + version + '"')
              page.write_text(content)
          PYTHON
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reference/demo
      - uses: actions/deploy-pages@v4
        id: deployment
